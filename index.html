
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>의정부 비건 식당 찾기</title>

  <style>
    /* 기본 화면 설정 */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }

    header {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: #24845b;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 21px;
    }

    /* 지도와 왼쪽 목록 배치 */
    .container {
      display: flex;
      height: calc(100vh - 64px);
      min-height: 450px;
    }

    .sidebar {
      width: 350px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: #fff;
    }

    /* 검색 탭 */
    .tabs {
      display: flex;
      padding: 12px;
      gap: 8px;
    }

    .tab-button {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 14px;
    }

    .tab-button.active {
      color: white;
      background: #24845b;
      border-color: #24845b;
      font-weight: bold;
    }

    /* 현재 위치 및 교통정보 버튼 */
    .tools {
      display: flex;
      gap: 8px;
      padding: 0 12px 12px;
    }

    .tools button {
      flex: 1;
      padding: 10px 5px;
      border: 1px solid #ddd;
      border-radius: 7px;
      background: white;
      cursor: pointer;
    }

    .tools button.active {
      background: #e0f3e8;
      border-color: #24845b;
    }

    #status {
      margin: 0;
      padding: 10px 14px;
      color: #555;
      background: #f7f7f7;
      font-size: 13px;
      line-height: 1.5;
    }

    #placeCount {
      padding: 12px 14px;
      font-weight: bold;
      border-bottom: 1px solid #eee;
    }

    /* 검색 결과 목록 */
    #placeList {
      flex: 1;
      overflow-y: auto;
    }

    .place-item {
      padding: 14px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }

    .place-item:hover {
      background: #f1f8f4;
    }

    .place-item.selected {
      background: #e0f3e8;
    }

    .place-name {
      margin-bottom: 6px;
      font-size: 15px;
      font-weight: bold;
    }

    .place-address {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .place-phone {
      margin-top: 5px;
      color: #777;
      font-size: 12px;
    }

    /* 지도 영역 */
    #map {
      flex: 1;
      min-width: 0;
      height: 100%;
    }

    @media (max-width: 650px) {
      header {
        height: 56px;
      }

      header h1 {
        font-size: 18px;
      }

      .container {
        height: calc(100vh - 56px);
        flex-direction: column;
      }

      #map {
        order: 1;
        flex: 1;
        min-height: 250px;
      }

      .sidebar {
        order: 2;
        width: 100%;
        height: 45%;
        min-height: 210px;
      }

      .tabs {
        padding: 7px;
      }

      .tools {
        padding: 0 7px 7px;
      }

      .tab-button,
      .tools button {
        padding: 9px 3px;
        font-size: 12px;
      }

      #placeCount {
        padding: 8px 10px;
        font-size: 13px;
      }

      #status {
        padding: 6px 10px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🥬 의정부 비건 식당 찾기</h1>
  </header>

  <main class="container">
    <aside class="sidebar">

      <div class="tabs">
        <button
          id="restaurantTab"
          class="tab-button active"
          type="button"
          aria-pressed="true"
        >
          🍽️ 음식점
        </button>

        <button
          id="veganTab"
          class="tab-button"
          type="button"
          aria-pressed="false"
        >
          🥬 비건 식당
        </button>
      </div>

      <div class="tools">
        <button id="locationButton" type="button">
          📍 현재 위치
        </button>

        <button
          id="trafficButton"
          type="button"
          aria-pressed="false"
        >
          🚦 교통정보 OFF
        </button>
      </div>

      <p id="status" role="status" aria-live="polite">
        지도를 준비하고 있어요.
      </p>

      <div id="placeCount">검색 결과 0곳</div>

      <div id="placeList">
        <div class="place-item">
          검색 결과가 여기에 표시됩니다.
        </div>
      </div>
    </aside>

    <div
      id="map"
      role="application"
      aria-label="주변 음식점 지도"
    ></div>
  </main>

  <!-- 카카오맵 SDK: YOUR_KAKAO_APP_KEY를 실제 JavaScript 키로 변경 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_APP_KEY&libraries=services"></script>

  <script>
    /* ------------------------------
       1. 주요 변수 설정
    ------------------------------ */

    // 의정부시청 주변을 기본 위치로 설정
    const defaultPosition = {
      lat: 37.7389,
      lng: 127.0474
    };

    // 현재 지도 위치와 검색 상태
    let currentPosition = new kakao.maps.LatLng(
      defaultPosition.lat,
      defaultPosition.lng
    );

    let currentTab = "restaurant";
    let markers = [];
    let placeData = [];
    let selectedOverlay = null;
    let trafficEnabled = false;
    let currentLocation = null;

    // 카카오맵 지도 생성
    const mapContainer = document.getElementById("map");

    const map = new kakao.maps.Map(mapContainer, {
      center: currentPosition,
      level: 5
    });

    // 장소 검색 서비스 생성
    const places = new kakao.maps.services.Places();

    // 지도에 현재 위치를 표시하는 마커
    const locationMarker = new kakao.maps.Marker({
      position: currentPosition,
      title: "현재 위치"
    });

    /* ------------------------------
       2. 화면 요소 가져오기
    ------------------------------ */

    const restaurantTab =
      document.getElementById("restaurantTab");

    const veganTab =
      document.getElementById("veganTab");

    const locationButton =
      document.getElementById("locationButton");

    const trafficButton =
      document.getElementById("trafficButton");

    const statusElement =
      document.getElementById("status");

    const placeCountElement =
      document.getElementById("placeCount");

    const placeListElement =
      document.getElementById("placeList");

    /* ------------------------------
       3. 기존 검색 결과 초기화
    ------------------------------ */

    function clearResults() {
      // 기존 마커 제거
      markers.forEach(function(marker) {
        marker.setMap(null);
      });

      markers = [];
      placeData = [];

      // 열려 있는 장소 팝업 닫기
      if (selectedOverlay) {
        selectedOverlay.setMap(null);
        selectedOverlay = null;
      }

      // 기존 목록 비우기
      placeListElement.replaceChildren();
      placeCountElement.textContent = "검색 결과 0곳";
    }

    /* ------------------------------
       4. 탭 디자인 변경
    ------------------------------ */

    function updateTabs() {
      const isRestaurant = currentTab === "restaurant";

      restaurantTab.classList.toggle(
        "active",
        isRestaurant
      );

      veganTab.classList.toggle(
        "active",
        !isRestaurant
      );

      restaurantTab.setAttribute(
        "aria-pressed",
        String(isRestaurant)
      );

      veganTab.setAttribute(
        "aria-pressed",
        String(!isRestaurant)
      );
    }

    /* ------------------------------
       5. 장소 검색
    ------------------------------ */

    function searchPlaces() {
      clearResults();

      const tabAtSearch = currentTab;

      statusElement.textContent =
        tabAtSearch === "restaurant"
          ? "주변 음식점을 검색하고 있어요."
          : "의정부시 비건 식당을 검색하고 있어요.";

      // 음식점 탭은 FD6 카테고리, 비건 탭은 키워드로 검색
      if (tabAtSearch === "restaurant") {
        places.categorySearch(
          "FD6",
          function(data, resultStatus) {
            handleSearchResults(
              data,
              resultStatus,
              tabAtSearch
            );
          },
          {
            location: currentPosition,
            radius: 5000,
            sort: kakao.maps.services.SortBy.DISTANCE
          }
        );
      } else {
        places.keywordSearch(
          "의정부시 비건 식당",
          function(data, resultStatus) {
            handleSearchResults(
              data,
              resultStatus,
              tabAtSearch
            );
          },
          {
            location: currentPosition,
            radius: 20000,
            sort: kakao.maps.services.SortBy.DISTANCE
          }
        );
      }
    }

    /* ------------------------------
       6. 검색 결과 처리
    ------------------------------ */

    function handleSearchResults(
      data,
      resultStatus,
      tabAtSearch
    ) {
      // 검색 도중 탭이 바뀌었다면 오래된 결과는 표시하지 않음
      if (tabAtSearch !== currentTab) {
        return;
      }

      if (
        resultStatus !==
        kakao.maps.services.Status.OK
      ) {
        clearResults();

        if (
          resultStatus ===
          kakao.maps.services.Status.ZERO_RESULT
        ) {
          statusElement.textContent =
            "검색 결과가 없어요. 다른 지역이나 검색어를 시도해 보세요.";
        } else {
          statusElement.textContent =
            "검색에 실패했어요. 앱 키와 도메인 설정을 확인해 주세요.";
        }

        return;
      }

      // 검색 결과를 지도와 목록에 표시
      placeData = data;
      placeCountElement.textContent =
        "검색 결과 " + data.length + "곳";

      statusElement.textContent =
        data.length + "곳을 찾았어요.";

      data.forEach(function(place, index) {
        addMarker(place, index);
        addPlaceToList(place, index);
      });
    }

    /* ------------------------------
       7. 지도 마커와 팝업 생성
    ------------------------------ */

    function addMarker(place, index) {
      const position = new kakao.maps.LatLng(
        Number(place.y),
        Number(place.x)
      );

      const marker = new kakao.maps.Marker({
        map: map,
        position: position,
        title: place.place_name
      });

      markers.push(marker);

      // 장소 이름과 주소를 표시하는 팝업
      const overlayContent = document.createElement("div");
      overlayContent.style.cssText =
        "padding:12px;background:white;border:1px solid #24845b;" +
        "border-radius:8px;box-shadow:0 2px 8px #0002;" +
        "min-width:160px;max-width:240px;font-size:13px;";

      const titleElement = document.createElement("strong");
      titleElement.textContent = place.place_name;
      titleElement.style.display = "block";
      titleElement.style.marginBottom = "6px";

      const addressElement = document.createElement("div");
      addressElement.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      addressElement.style.cssText =
        "color:#555;line-height:1.5;overflow-wrap:anywhere;";

      overlayContent.append(
        titleElement,
        addressElement
      );

      const overlay = new kakao.maps.CustomOverlay({
        content: overlayContent,
        position: position,
        yAnchor: 1.5,
        zIndex: 10
      });

      // 마커를 클릭하면 해당 장소의 팝업 표시
      kakao.maps.event.addListener(
        marker,
        "click",
        function() {
          showPlace(index);
        }
      );

      // 팝업은 선택된 마커에 대해서만 표시
      marker._placeOverlay = overlay;
    }

    /* ------------------------------
       8. 왼쪽 장소 목록 생성
    ------------------------------ */

    function addPlaceToList(place, index) {
      const item = document.createElement("div");
      item.className = "place-item";

      const name = document.createElement("div");
      name.className = "place-name";
      name.textContent = place.place_name;

      const address = document.createElement("div");
      address.className = "place-address";
      address.textContent =
        place.road_address_name ||
        place.address_name ||
        "주소 정보 없음";

      item.append(name, address);

      // 전화번호가 있는 경우 표시
      if (place.phone) {
        const phone = document.createElement("div");
        phone.className = "place-phone";
        phone.textContent = place.phone;
        item.appendChild(phone);
      }

      // 목록을 누르면 지도 이동 및 팝업 표시
      item.addEventListener("click", function() {
        showPlace(index);
      });

      placeListElement.appendChild(item);
    }

    /* ------------------------------
       9. 장소 선택 및 팝업 표시
    ------------------------------ */

    function showPlace(index) {
      const place = placeData[index];
      const marker = markers[index];

      if (!place || !marker) {
        return;
      }

      // 이전 팝업 닫기
      if (selectedOverlay) {
        selectedOverlay.setMap(null);
      }

      // 선택된 장소 팝업 열기
      selectedOverlay = marker._placeOverlay;
      selectedOverlay.setMap(map);

      // 선택한 장소로 지도 이동
      map.panTo(marker.getPosition());

      // 선택한 목록 항목 강조
      const items =
        placeListElement.querySelectorAll(".place-item");

      items.forEach(function(item, itemIndex) {
        item.classList.toggle(
          "selected",
          itemIndex === index
        );
      });
    }

    /* ------------------------------
       10. 탭 버튼 이벤트
    ------------------------------ */

    restaurantTab.addEventListener("click", function() {
      if (currentTab === "restaurant") return;

      currentTab = "restaurant";
      updateTabs();
      searchPlaces();
    });

    veganTab.addEventListener("click", function() {
      if (currentTab === "vegan") return;

      currentTab = "vegan";
      updateTabs();
      searchPlaces();
    });

    /* ------------------------------
       11. 현재 위치 기능
    ------------------------------ */

    function moveToCurrentLocation() {
      if (!navigator.geolocation) {
        statusElement.textContent =
          "이 브라우저는 위치 기능을 지원하지 않아요.";
        return;
      }

      statusElement.textContent =
        "현재 위치를 확인하고 있어요.";

      navigator.geolocation.getCurrentPosition(
        function(position) {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          currentPosition = new kakao.maps.LatLng(
            latitude,
            longitude
          );

          currentLocation = currentPosition;

          // 지도와 현재 위치 마커 이동
          map.setCenter(currentPosition);
          map.setLevel(5);

          locationMarker.setPosition(currentPosition);
          locationMarker.setMap(map);

          statusElement.textContent =
            "현재 위치를 찾았어요. 주변 장소를 검색합니다.";

          // 현재 선택된 탭으로 다시 검색
          searchPlaces();
        },
        function(error) {
          let message = "현재 위치를 확인하지 못했어요.";

          if (error.code === 1) {
            message =
              "위치 권한이 거부되었어요. 브라우저의 위치 권한을 확인해 주세요.";
          } else if (error.code === 2) {
            message =
              "현재 위치 정보를 사용할 수 없어요.";
          } else if (error.code === 3) {
            message =
              "위치 확인 시간이 초과되었어요. 다시 시도해 주세요.";
          }

          statusElement.textContent = message;
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    locationButton.addEventListener(
      "click",
      moveToCurrentLocation
    );

    /* ------------------------------
       12. 교통정보 표시 기능
    ------------------------------ */

    trafficButton.addEventListener("click", function() {
      trafficEnabled = !trafficEnabled;

      if (trafficEnabled) {
        map.addOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );

        trafficButton.textContent = "🚦 교통정보 ON";
        trafficButton.classList.add("active");
      } else {
        map.removeOverlayMapTypeId(
          kakao.maps.MapTypeId.TRAFFIC
        );

        trafficButton.textContent = "🚦 교통정보 OFF";
        trafficButton.classList.remove("active");
      }

      trafficButton.setAttribute(
        "aria-pressed",
        String(trafficEnabled)
      );
    });

    /* ------------------------------
       13. 페이지 초기화
    ------------------------------ */

    // 기본 위치인 의정부시청 주변에서 먼저 검색
    updateTabs();
    searchPlaces();

    // 브라우저가 위치 권한을 허용하면 현재 위치 기준으로 검색
    // 위치 권한을 허용하지 않아도 기본 위치에서 검색 가능
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        function(position) {
          currentPosition = new kakao.maps.LatLng(
            position.coords.latitude,
            position.coords.longitude
          );

          currentLocation = currentPosition;

          map.setCenter(currentPosition);
          locationMarker.setPosition(currentPosition);
          locationMarker.setMap(map);

          searchPlaces();
        },
        function() {
          // 위치 확인에 실패하면 의정부시청 기본 위치 유지
        },
        {
          timeout: 5000,
          maximumAge: 60000
        }
      );
    }
    #map {
  width: 100%;
  height: 100%;
  min-height: 250px;
      <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_APP_KEY&autoload=false"></script>
}
  </script>
</body>
</html>
