<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오맵 장소 검색 서비스</title>
    <style>
        /* 기본 스타일 리셋 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', sans-serif;
            overflow: hidden;
        }

        /* 메인 컨테이너: 왼쪽/오른쪽 2분할 레이아웃 */
        .container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 왼쪽 검색 패널 영역 */
        .sidebar {
            width: 380px;
            height: 100%;
            background-color: #f8f9fa;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 검색 입력 박스 영역 */
        .search-box {
            padding: 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 8px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #fbd300; /* 카카오 노란색 액센트 */
        }

        .search-box button {
            padding: 10px 16px;
            background-color: #ffeb00;
            color: #3c1e1e;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .search-box button:hover {
            background-color: #f7e300;
        }

        /* 검색 결과 리스트 영역 */
        .result-list {
            flex: 1;
            overflow-y: auto;
            list-style: none;
        }

        .result-item {
            padding: 15px 20px;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            background-color: #ffffff;
            transition: background-color 0.2s;
        }

        .result-item:hover {
            background-color: #f1f3f5;
        }

        .result-item h4 {
            font-size: 16px;
            color: #333333;
            margin-bottom: 5px;
        }

        .result-item p {
            font-size: 13px;
            color: #666666;
            line-height: 1.4;
        }

        .result-item .phone {
            font-size: 12px;
            color: #092e6b;
            margin-top: 4px;
        }

        /* 결과가 없거나 초기 안내 문구 스타일 */
        .placeholder-text {
            padding: 40px 20px;
            text-align: center;
            color: #868e96;
            font-size: 14px;
        }

        /* 오른쪽 지도 영역 */
        .map-container {
            flex: 1;
            height: 100%;
            background-color: #e9ecef; /* 지도가 들어서기 전 로딩 배경 */
        }
    </style>

    <!-- 카카오 지도 API 스크립트 로드 -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=15499fe53d1598bafed0601edaa7cce7&libraries=services"></script>
</head>
<body>

    <div class="container">
        <!-- 왼쪽 패널: 검색창 및 검색 결과 목록 -->
        <div class="sidebar">
            <form class="search-box" id="searchForm" onsubmit="return false;">
                <input type="text" id="keywordInput" placeholder="장소를 검색하세요 (예: 강남역 맛집)" />
                <button type="submit" id="searchBtn">검색</button>
            </form>
            <ul class="result-list" id="resultList">
                <li class="placeholder-text">검색어를 입력 후 검색 버튼을 누르세요.</li>
            </ul>
        </div>

        <!-- 오른쪽 영역: 지도 표시 -->
        <div class="map-container" id="map"></div>
    </div>

    <script>
        // 전역 변수 선언
        let map; // 지도 객체
        let ps; // 장소 검색 서비스 객체
        let infowindow; // 정보창 객체
        let markers = []; // 마커 관리 배열

        // 페이지 DOM이 완전히 로드된 후 실행
        window.addEventListener('DOMContentLoaded', function () {
            // 카카오 지도 객체가 정상적으로 로드되었는지 확인
            if (typeof kakao === 'undefined' || !kakao.maps) {
                alert('카카오 지도 API를 불러오지 못했습니다.\n[카카오 디벨로퍼스]에서 JavaScript 키 및 플랫폼 도메인 설정을 확인해 주세요.');
                return;
            }

            initMap();
        });

        // 지도 및 서비스 초기화
        function initMap() {
            const container = document.getElementById('map');
            
            // 서울시청 기본 좌표 (위치 권한 실패 시 사용)
            const defaultCenter = new kakao.maps.LatLng(37.566826, 126.9786567);

            const options = {
                center: defaultCenter,
                level: 5 // 요구사항: 지도 확대 레벨 5
            };

            // 지도 생성
            map = new kakao.maps.Map(container, options);

            // 장소 검색 객체 및 인포윈도우 생성
            ps = new kakao.maps.services.Places();
            infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

            // 사용자 현재 위치 확인 시도
            requestUserLocation(defaultCenter);

            // 검색 폼 이벤트 연결
            document.getElementById('searchForm').addEventListener('submit', function (e) {
                e.preventDefault();
                searchPlaces();
            });
        }

        // 현재 위치 요청 함수 (실패해도 기본 위치 유지)
        function requestUserLocation(defaultCenter) {
            if (navigator.geolocation && location.protocol !== 'file:') {
                navigator.geolocation.getCurrentPosition(
                    function (position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        const userPosition = new kakao.maps.LatLng(lat, lon);

                        map.setCenter(userPosition);

                        const currentMarker = new kakao.maps.Marker({
                            map: map,
                            position: userPosition
                        });

                        const info = new kakao.maps.InfoWindow({
                            content: '<div style="padding:5px;font-size:12px;">현재 위치</div>'
                        });
                        info.open(map, currentMarker);
                    },
                    function (error) {
                        console.log('위치 정보 가져오기 실패, 기본 위치 사용:', error.message);
                    }
                );
            } else {
                console.log('로컬 파일 환경이거나 Geolocation 미지원으로 기본 위치를 사용합니다.');
            }
        }

        // 장소 검색 함수
        function searchPlaces() {
            const keyword = document.getElementById('keywordInput').value.trim();

            if (!keyword) {
                alert('검색어를 입력해 주세요!');
                return;
            }

            ps.keywordSearch(keyword, placesSearchCB);
        }

        // 장소 검색 콜백 함수
        function placesSearchCB(data, status, pagination) {
            if (status === kakao.maps.services.Status.OK) {
                displayPlaces(data);
            } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
                alert('검색 결과가 존재하지 않습니다.');
                clearSearchResults();
            } else if (status === kakao.maps.services.Status.ERROR) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        // 검색 결과 목록 및 마커 표시
        function displayPlaces(places) {
            const listEl = document.getElementById('resultList');
            const bounds = new kakao.maps.LatLngBounds();

            removeMarkers();
            listEl.innerHTML = '';

            for (let i = 0; i < places.length; i++) {
                const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
                const marker = addMarker(placePosition, i);
                const itemEl = createListItem(i, places[i]);

                bounds.extend(placePosition);

                (function (marker, title, placePosition) {
                    kakao.maps.event.addListener(marker, 'click', function () {
                        displayInfowindow(marker, title);
                    });

                    itemEl.onclick = function () {
                        map.panTo(placePosition);
                        displayInfowindow(marker, title);
                    };
                })(marker, places[i].place_name, placePosition);

                listEl.appendChild(itemEl);
            }

            map.setBounds(bounds);
        }

        // 리스트 항목 생성
        function createListItem(index, place) {
            const el = document.createElement('li');
            el.className = 'result-item';

            const addressStr = place.road_address_name ? place.road_address_name : place.address_name;

            el.innerHTML = `
                <h4>${index + 1}. ${place.place_name}</h4>
                <p>${addressStr}</p>
                <div class="phone">${place.phone || '전화번호 없음'}</div>
            `;

            return el;
        }

        // 마커 추가
        function addMarker(position, idx) {
            const marker = new kakao.maps.Marker({
                position: position,
                map: map
            });

            markers.push(marker);
            return marker;
        }

        // 기존 마커 지우기
        function removeMarkers() {
            for (let i = 0; i < markers.length; i++) {
                markers[i].setMap(null);
            }
            markers = [];
        }

        // 인포윈도우 표시
        function displayInfowindow(marker, title) {
            const content = `<div style="padding:6px 12px;font-size:12px;font-weight:bold;color:#333;">${title}</div>`;
            infowindow.setContent(content);
            infowindow.open(map, marker);
        }

        // 검색 결과 초기화
        function clearSearchResults() {
            removeMarkers();
            document.getElementById('resultList').innerHTML = '<li class="placeholder-text">검색 결과가 없습니다.</li>';
        }
    </script>
</body>
</html>
